[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-agentic"
dynamic = ["version"]
description = "A self-improving agent framework: pluggable providers, a tool registry, skills, and a multi-platform chat gateway."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Siphya" }]
keywords = ["agent", "llm", "tools", "skills", "gateway"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "rich>=13,<15",
  "typer>=0.15,<1",
  "tomli-w>=1.0,<2",
  "platformdirs>=4,<5",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.8"]
keyring = ["keyring>=25"]
docker = ["docker>=7"]
repl = ["prompt_toolkit>=3.0.48,<4"]
gateway = ["aiohttp>=3.10,<4"]
all = ["harness-agentic[tokens,keyring,docker,repl,gateway]"]

[project.scripts]
harn = "harness_agentic.cli.main:main"
harness-agentic = "harness_agentic.cli.main:main"

[project.entry-points."harness_agentic.plugins"]
# third-party plugins register here

[project.urls]
Homepage = "https://github.com/humyai99/Harness-Agentic"
Repository = "https://github.com/humyai99/Harness-Agentic"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-xdist>=3",
  "hypothesis>=6",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4",
]

[tool.hatch.version]
path = "src/harness_agentic/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_agentic"]

# ---------------------------------------------------------------- ruff ------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "D", "UP", "ANN", "ASYNC", "S", "B", "A", "C4",
  "DTZ", "T20", "EM", "ISC", "ICN", "G", "LOG", "PIE", "PT", "Q", "RET",
  "SIM", "TID", "TC", "ARG", "PTH", "PL", "TRY", "FLY", "PERF", "RUF",
]
ignore = [
  "D203",    # conflicts with D211
  "D213",    # conflicts with D212
  "ANN401",  # Any is sometimes the honest annotation
  "PLR0913", # the orchestrator genuinely takes many collaborators
  "TRY003",  # long messages in raise are fine when they are the whole story
  "EM101",   # ditto
  "ISC001",  # conflicts with the formatter
  "COM812",  # conflicts with the formatter
  # Exceptions read better at the raise site without the suffix: `raise
  # RateLimited(...)` and `except ContextOverflow` say what happened. The base
  # class is HarnessError, so the hierarchy is still obvious.
  "N818",
  # TC001/TC002 still apply. TC003 only defers *stdlib* imports, which are
  # already loaded by the time we run, so it buys nothing and costs a
  # TYPE_CHECKING block in every module -- one that silently breaks the day a
  # dataclass here becomes a pydantic model.
  "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "D1", "ANN", "PLR2004", "ARG", "INP001", "TC"]
"scripts/**" = ["T20", "INP001", "D1"]
# Typer's API *is* calls-in-defaults, and a CLI command legitimately takes many
# flags. Fighting the framework here would make the commands harder to read.
"src/harness_agentic/cli/**" = ["B008", "PLR0913", "PLR0917"]
# The single sanctioned place for subprocess: the local execution environment.
# run_shell() is a deliberate, separately-audited capability -- tools that
# expose it are classified destructive and go through the approval policy.
"src/harness_agentic/envs/local.py" = ["S603", "S604", "S607"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "pydantic.field_validator"]

# ---------------------------------------------------------------- mypy ------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
enable_error_code = [
  "redundant-expr",
  "possibly-undefined",
  "truthy-bool",
  "ignore-without-code",
  "unused-awaitable",
]
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["docker.*", "tiktoken.*", "keyring.*", "prompt_toolkit.*", "tomli_w.*"]
ignore_missing_imports = true

# -------------------------------------------------------------- pytest ------

[tool.pytest.ini_options]
addopts = "-m 'not integration' --strict-markers --strict-config -ra"
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
  "integration: hits a real provider or platform API (deselected by default)",
  "slow: takes more than two seconds",
]

# ------------------------------------------------------------ coverage ------

[tool.coverage.run]
source = ["src/harness_agentic"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
  "@overload",
]
