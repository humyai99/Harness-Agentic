# A scripted tour of the agent loop, for `fake/scripted`.
#
# This file is the model's half of a conversation, written down in advance.
# Everything else is real: real tool dispatch against the real filesystem, real
# approval policy, real session store, real prompt assembly. Only the model is
# replaced -- so a failure while running this is a failure of the harness rather
# than of the weather, and it needs no API key, no network, and no bill.
#
#   export HARNESS_FAKE_SCRIPT=examples/tour.yaml
#   uv run harn run -m fake/scripted --toolsets file,memory --yes \
#     "have a look around this project"
#
# Each turn is one model response. `tool:` calls a tool, `text:` answers.
turns:
  - text: Let me see what this project is.
    tool: read_file
    arguments: {path: pyproject.toml}

  - tool: grep_files
    arguments: {pattern: "^def ", path: src/harness_agentic/memory}

  - tool: memory_add
    arguments:
      kind: memory
      text: Harness-Agentic is a Python agent framework; memory lives in src/harness_agentic/memory.
      section: Layout

  - text: >
      This is harness-agentic, a Python agent framework. The memory subsystem is
      in src/harness_agentic/memory and defines parse_entries alongside the
      MemoryStore methods. I noted the layout so I have it next session.
